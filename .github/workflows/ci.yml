name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify zero-config package load
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent-local
          PI_OFFLINE: "1"
        run: |
          ./node_modules/.bin/pi install "$GITHUB_WORKSPACE"
          ./node_modules/.bin/pi list
          ./node_modules/.bin/pi --list-models > /dev/null

      - name: Verify Git installation
        if: github.event_name == 'push'
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent-git
          PI_OFFLINE: "1"
        run: |
          ./node_modules/.bin/pi install "git:github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          ./node_modules/.bin/pi list
          ./node_modules/.bin/pi --list-models > /dev/null
